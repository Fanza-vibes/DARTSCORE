# Pubblica una release di DartScore.
#
# COSA GARANTISCE
#   1. Il file allegato e' quello del repository a quel tag, non un download
#      fatto a mano: l'allegato coincide col codice per costruzione.
#   2. La versione dichiarata nel file corrisponde al tag, altrimenti si
#      ferma. Un artefatto che mente sulla propria versione non esce.
#   3. Le verifiche di tests.html passano (calendario contro il Referto Gara
#      FIGeST e regole di punteggio contro il regolamento).
#   4. La descrizione e' la sezione di CHANGELOG.md di quella versione, non un
#      testo riscritto a mano che puo' divergere dallo storico.
#
# COME SI ATTIVA
#   - da solo, quando viene pubblicato un tag "v*"
#   - a mano (Actions -> Pubblica release -> Run workflow) indicando un tag
#     esistente, per riallineare le note di una release gia' pubblicata
#
# DUE SCELTE DA SPIEGARE
#   - Lo script delle note e quello dei test stanno dentro questo file e non
#     in file separati: il checkout preleva l'albero del TAG, e ai tag
#     precedenti la cartella .github non esiste. Il workflow invece viene
#     letto dal ramo da cui parte.
#   - Il controllo completo sui sei punti in cui compare la versione vale solo
#     per i nuovi rilasci. Sui tag fino a v2.9.4 l'header statico e il footer
#     dell'informativa riportavano ancora "2.9.2": erano valori sovrascritti a
#     runtime da init(), quindi l'utente vedeva il numero giusto, ma il testo
#     nel file era vecchio. Un controllo severo bloccherebbe il riallineamento
#     di quelle release, che e' proprio uno degli usi previsti.

name: Pubblica release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da pubblicare o riallineare (es. v2.11.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Determina il tag
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Preleva il codice a quel tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.tag }}

      - name: Verifica la versione dichiarata nel file
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          V="${TAG#v}"
          errori=0
          controlla() {
            if [ "$2" = "$V" ]; then
              echo "  ok      $1: $2"
            else
              echo "::error::$1 riporta '$2' ma il tag e' '$V'"
              errori=$((errori+1))
            fi
          }
          echo "Controlli sempre attivi:"
          controlla "APP_VERSION" \
            "$(grep -o "APP_VERSION='[^']*'" Darts_Score.html | head -1 | sed "s/.*'\(.*\)'/\1/")"
          controlla "intestazione del sorgente" \
            "$(grep -o '/\* DartScore v[0-9.]*' Darts_Score.html | head -1 | sed 's/.*v//')"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Controlli aggiuntivi (solo nuovi rilasci):"
            controlla "header della schermata iniziale" \
              "$(grep -o 'id="app-version">v[0-9.]*' Darts_Score.html | head -1 | sed 's/.*v//')"
            controlla "footer dell'informativa" \
              "$(grep -o 'Versione [0-9.]*' Darts_Score.html | head -1 | sed 's/Versione //')"
            controlla "sezione del CHANGELOG" \
              "$(grep -m1 -o '^## v[0-9.]*' CHANGELOG.md | sed 's/.*v//')"
            controlla "voce del README" \
              "$(grep -m1 -o '^\*\*v[0-9.]*\*\*' README.md | sed 's/\*//g; s/^v//')"
          fi
          if [ "$errori" -gt 0 ]; then
            echo "Pubblicazione annullata: $errori disallineamenti."
            exit 1
          fi

      - name: Esegui le verifiche di tests.html
        if: hashFiles('tests.html') != ''
        run: |
          npm install --silent --no-audit --no-fund playwright-core
          python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8099/tests.html >/dev/null && break; sleep 1; done
          node - <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          const candidati = ['/usr/bin/google-chrome', '/usr/bin/google-chrome-stable',
                             '/usr/bin/chromium-browser', '/usr/bin/chromium'];
          const exe = candidati.find(p => fs.existsSync(p));
          if (!exe) { console.error('Nessun browser trovato fra: ' + candidati.join(', ')); process.exit(1); }
          (async () => {
            const b = await chromium.launch({ executablePath: exe });
            const p = await (await b.newContext()).newPage();
            const errori = [];
            p.on('pageerror', e => errori.push(e.message));
            await p.goto('http://127.0.0.1:8099/tests.html');
            await p.waitForFunction(
              () => { const e = document.getElementById('esito'); return e && !e.classList.contains('attesa'); },
              null, { timeout: 60000 });
            console.log(await p.evaluate(() => document.getElementById('esito').textContent));
            const falliti = await p.evaluate(() =>
              Array.from(document.querySelectorAll('.r'))
                   .filter(r => r.querySelector('.ko'))
                   .map(r => r.textContent.trim()));
            falliti.forEach(f => console.log('::error::verifica fallita — ' + f));
            errori.forEach(e => console.log('::error::errore JavaScript — ' + e));
            await b.close();
            process.exit(falliti.length || errori.length ? 1 : 0);
          })();
          JS

      - name: Componi le note dal CHANGELOG
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          python3 - <<'PY'
          import io, os, re, sys
          tag = os.environ['TAG']
          ver = tag[1:] if tag.startswith('v') else tag
          testo = io.open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## v' + re.escape(ver) + r'[^\n]*\n(.*?)(?=\n---\n|\Z)', testo, re.S | re.M)
          if not m:
              sys.stderr.write('Nessuna sezione "## v%s" in CHANGELOG.md\n' % ver)
              sys.exit(1)
          coda = '\n'.join([
              '', '', '---', '', '## Come si usa', '',
              'Scarica `Darts_Score.html` qui sotto e aprilo con un doppio clic: '
              'si apre nel browser e funziona offline, senza installare nulla.', '',
              'In alternativa, versione web: https://fanza-vibes.github.io/DARTSCORE/', '',
              'Verifiche automatiche del calendario e delle regole: '
              'https://fanza-vibes.github.io/DARTSCORE/tests.html', '',
              'Storico completo delle versioni: '
              'https://github.com/Fanza-vibes/DARTSCORE/blob/main/CHANGELOG.md',
          ])
          io.open('NOTE_RELEASE.md', 'w', encoding='utf-8').write(m.group(1).strip() + coda)
          print('Note composte per %s: %d caratteri dal CHANGELOG' % (tag, len(m.group(1).strip())))
          PY

      - name: Crea o riallinea la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release gia' esistente: aggiorno note e allegato"
            gh release edit "$TAG" --notes-file NOTE_RELEASE.md
            gh release upload "$TAG" Darts_Score.html --clobber
          else
            echo "Release non esistente: la creo"
            gh release create "$TAG" Darts_Score.html \
              --title "DartScore ${TAG#v}" \
              --notes-file NOTE_RELEASE.md
          fi

      - name: Riepilogo
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          {
            echo "### Release \`$TAG\`"
            echo ""
            echo "- Allegato \`Darts_Score.html\`, $(wc -c < Darts_Score.html) byte"
            echo "- Versione dichiarata nel file verificata contro il tag"
            echo "- Note estratte dalla sezione di CHANGELOG.md"
          } >> "$GITHUB_STEP_SUMMARY"
